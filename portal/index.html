<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوابة أولياء الأمور | أكاديمية عزم</title>
  <meta name="description" content="بوابة أولياء الأمور والطاقم في أكاديمية عزم لكرة القدم.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1712">
  <link rel="icon" href="../assets/azm-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css?v=salla-1">
  <style>
    .auth { min-height: 100vh; }
    .loading { min-height: 100vh; display: grid; place-items: center; color: var(--text-soft); }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .12); border-top-color: var(--gold); animation: spin .8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }
    .back-home { display: inline-block; margin-top: 10px; color: var(--text-soft); font-size: 12.5px; }
    .kids-list { display: grid; gap: 10px; margin-top: 14px; text-align: start; }
    .nav-soon { display: block; padding: 8px 14px; font-size: 11.5px; color: var(--text-soft); opacity: .7; }
    @media (max-width: 959px) { .nav-soon { display: none; } }
    .main .topbar .prow-actions { flex-wrap: nowrap; }
  </style>
</head>
<body>
  <div id="app"><div class="loading"><div><div class="spinner"></div>جاري التحميل…</div></div></div>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>window.AZM_MODE = 'parent';</script>
  <script src="config.js"></script>
  <script src="app.js?v=salla-1"></script>
</body>
</html>
