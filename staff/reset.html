<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1712">
  <title>استعادة كلمة المرور | أكاديمية عزم</title>
  <link rel="icon" href="../assets/azm-logo.png">
  <link rel="stylesheet" href="../portal/portal.css">
  <link rel="stylesheet" href="../portal/support.css">
</head>
<body class="support-reset">
  <main class="auth">
    <div class="auth-card">
      <h1>تعيين كلمة مرور جديدة</h1>
      <p class="sub">اختَر 8 أحرف على الأقل، فيها رقم واحد على الأقل.</p>
      <form id="reset-form" class="support-form" hidden>
        <label for="reset-pass">كلمة المرور الجديدة</label>
        <input type="password" dir="ltr" id="reset-pass" autocomplete="new-password" minlength="8" required>
        <label for="reset-repeat">تأكيد كلمة المرور</label>
        <input type="password" dir="ltr" id="reset-repeat" autocomplete="new-password" minlength="8" required>
        <button class="btn btn-gold">حفظ كلمة المرور</button>
      </form>
      <p id="reset-status" class="form-error" role="status"></p>
      <p class="auth-help"><a href="../staff/">دخول الطاقم</a> · <a href="../portal/">دخول أولياء الأمور</a></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../portal/config.js"></script>
  <script src="../portal/reset.js"></script>
</body>
</html>
