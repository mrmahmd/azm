<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أكاديمية عزم لكرة القدم | قريبًا</title>
  <meta name="description" content="أكاديمية عزم لكرة القدم — مهارة في الملعب، وقيم في الحياة. الموقع قيد الإعداد.">
  <link rel="icon" href="assets/azm-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#101113; --gold:#D5A63E; --silver:#C5CAD1; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:#fff;
           font-family:'Alexandria', system-ui, sans-serif; text-align:center; padding:24px 16px; }
    main { max-width:560px; }
    img { width:180px; height:auto; margin-bottom:24px; }
    h1 { font-size:clamp(1.6rem, 5vw, 2.4rem); font-weight:800; margin:0 0 12px; }
    .tag { color:var(--gold); font-weight:700; font-size:1.15rem; margin:0 0 20px; }
    p { color:var(--silver); line-height:1.9; margin:0; }
  </style>
</head>
<body>
  <main>
    <img src="assets/azm-logo.png" alt="شعار أكاديمية عزم لكرة القدم AZM FC" width="180" height="200">
    <h1>أكاديمية عزم لكرة القدم</h1>
    <p class="tag">مهارة في الملعب، وقيم في الحياة</p>
    <p>موقعنا قيد الإعداد، وسيُطلق قريبًا.</p>
  </main>
</body>
</html>
